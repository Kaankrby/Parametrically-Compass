name: Verify Compass
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-mcp.txt pytest pyyaml "ruff>=0.15,<0.16"
      - run: python -m ruff check lib Compass.tab mcp_server scripts tests
      - run: python scripts/build_reader.py --check
      - run: python -m pytest tests -q
      - run: python scripts/test_mcp.py
      - run: python scripts/package_release.py
      - run: git diff --check
